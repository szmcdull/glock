name: Update goid

on:
  schedule:
    # 每天 UTC 02:00（北京时间 10:00）
    - cron: "0 2 * * *"
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Bump github.com/petermattis/goid
        run: go get github.com/petermattis/goid@latest && go mod tidy

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(deps): bump github.com/petermattis/goid"
          title: "chore(deps): bump github.com/petermattis/goid"
          body: |
            自动将 `github.com/petermattis/goid` 更新到最新伪版本。

            `petermattis/goid` 没有 semver tag，Dependabot 不会更新伪版本→伪版本，因此用本 workflow 代替。
          branch: deps/update-goid
          delete-branch: true
          labels: dependencies
